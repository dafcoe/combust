<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="combust-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#161e2e" />
    </linearGradient>
    <linearGradient id="combust-flame" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="40%" stop-color="#06b6d4" />
      <stop offset="75%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <linearGradient id="combust-inner" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.3" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="128" fill="url(#combust-bg)" />
  <rect width="504" height="504" x="4" y="4" rx="124" fill="none" stroke="#334155" stroke-width="4" stroke-opacity="0.4" />

  <!-- Outer Fuel Flame / Droplet -->
  <path
    d="M 256 80
       C 288 160 368 224 368 312
       C 368 382 318 432 256 432
       C 194 432 144 382 144 312
       C 144 240 208 176 256 80 Z"
    fill="url(#combust-flame)"
    filter="url(#glow)"
  />

  <!-- Dynamic Inner Core Droplet -->
  <path
    d="M 256 192
       C 276 244 312 280 312 332
       C 312 368 286 396 256 396
       C 226 396 200 368 200 332
       C 200 288 232 248 256 192 Z"
    fill="url(#combust-inner)"
  />

  <!-- Minimalist Speed / Mobility Spark -->
  <circle cx="256" cy="336" r="16" fill="#ffffff" opacity="0.95" />
</svg>